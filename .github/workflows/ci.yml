name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # um teste travado não pode prender o runner por horas (o normal é menos de 10 minutos)
    timeout-minutes: 25
    env:
      # instala o serviço de verdade (tests/servico_windows.rs); o runner é descartável
      KIOSK_TESTE_SERVICO: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      # a bandeja precisa de uma sessão interativa: o teste falha, em vez de pular, se não houver
      KIOSK_TESTE_EXIGE_SESSAO: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
