[package]
name = "kiosk-engine"
version = "0.1.0"
edition = "2024" # Edição mais recente com suporte a features defensivas

# --- DEPENDÊNCIAS EXTERNAS (CRÍTICAS PARA LOG FORENSE) ---
[[bin]] 
name = "security_logger_impl"  # Binary específico para o módulo de logs forenses.
path = "../src/security_logger_impl.rs"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio"] }    # Persistência SQL com driver Tokio (async).
uuid = { version = "=1.9.2", features = ["v4", "serde"] }     # Geração de UUIDs únicos para PK imutáveis dos logs.
chrono = { version = "=0.4.38", features = ["serde"] }        # Timestamp UTC com serialização JSON/DB precisa.

# --- DEPENDÊNCIAS INTERNAS (MODULOS DO PROJETO) ---
[workspace]
members = ["."]  # Garante que os módulos internos resolvam dependências entre si corretamente no build.